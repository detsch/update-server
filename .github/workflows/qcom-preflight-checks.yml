name: Qualcomm Preflight Checks
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  qcom-preflight-checks:
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@b070a366a3cfc48e398e7008dab2590fa343daeb # v2
    with:
      enable-semgrep-scan: true
      enable-dependency-review: true
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: false
    permissions:
      contents: read
      security-events: write
