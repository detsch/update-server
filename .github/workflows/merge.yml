name: Post merge check
on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Set up golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # e2e runs fioserver, which panics on LFS pointer stubs
          lfs: true

      - name: Build environment
        run: |
           cd contrib/e2e
           make build

      - name: Run tests
        run: |
           cd contrib/e2e
           make run